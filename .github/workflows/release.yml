name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Run tests
        run: go test -count=1 ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build release binaries
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          mkdir -p dist

          platforms="
          darwin/amd64
          linux/amd64
          windows/amd64
          "

          for platform in $platforms; do
            goos="${platform%/*}"
            goarch="${platform#*/}"
            cli_binary_name="skillsdex-${goos}-${goarch}"
            daemon_binary_name="skillsdexd-${goos}-${goarch}"
            if [ "$goos" = "windows" ]; then
              cli_binary_name="${cli_binary_name}.exe"
              daemon_binary_name="${daemon_binary_name}.exe"
            fi

            echo "Building ${cli_binary_name}..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags="-s -w -X skillsdex.version=0.${RUN_NUMBER}" \
              -o "dist/${cli_binary_name}" ./cmd/skillsdex

            echo "Building ${daemon_binary_name}..."
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags="-s -w -X skillsdex.version=0.${RUN_NUMBER}" \
              -o "dist/${daemon_binary_name}" ./cmd/skillsdexd
          done

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          retention-days: 30

  release:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release/

      - name: Generate checksums
        run: |
          set -eu
          cd release
          for file in skillsdex*; do
            sha256sum "$file" > "$file.sha256"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Release v0.${{ github.run_number }}
          body: |
            ## SkillsDex v0.${{ github.run_number }}

            Automated build from commit ${{ github.sha }}.

            ### Downloads

            | Platform | CLI | Server |
            |----------|-----|--------|
            | macOS x86_64 | `skillsdex-darwin-amd64` | `skillsdexd-darwin-amd64` |
            | Linux x86_64 | `skillsdex-linux-amd64` | `skillsdexd-linux-amd64` |
            | Windows x86_64 | `skillsdex-windows-amd64.exe` | `skillsdexd-windows-amd64.exe` |

            ### Verify download

            ```bash
            sha256sum -c skillsdex-linux-amd64.sha256
            ```
          files: release/*
          draft: false
          prerelease: false
